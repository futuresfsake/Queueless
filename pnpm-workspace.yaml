packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@nestjs/core": true
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  # Pulled in by testcontainers (docker-modem -> ssh2). Native add-ons are optional; not needed.
  cpu-features: false
  protobufjs: false
  ssh2: false
